# σ N1 — S3 게이트: 소형 flow_policy (ManiSkill PickCube) 로 SAC-Flow chunked 재현.
#
# 목적: BPTT 안정성 및 chunked TD 수치 검증을 large π0.5 적용 전에 작은 모델로.
# 기준: PickCube SR > 0.85, BPTT grad norm < 10
#
# Derived from maniskill_sac_flow_state.yaml (작은 flow_policy MLP).
# 차이: chunk H=5, csf 분기 활성, BC reg = 0 (PickCube 는 demo 가 없으므로).
defaults:
  - env/maniskill_pick_cube@env.train
  - env/maniskill_pick_cube@env.eval
  - model/mlp_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "csf_flow_state_pickcube"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: 100
  save_interval: -1

algorithm:
  update_epoch: 32
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1

  agg_q: min
  actor_agg_q: min
  critic_subsample_size: 2
  enable_drq: False

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level   # σ — chunked TD
  logprob_type: action_level
  entropy_type: action_level

  adv_type: embodied_csf      # σ N1
  loss_type: embodied_csf     # σ N1
  loss_agg_func: "token-mean"

  bootstrap_type: standard
  chunked_per_step_termination: True
  gamma: 0.96
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.2
    target_entropy: -4
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  critic_actor_ratio: 3
  backup_entropy: True

  replay_buffer:
    enable_cache: True
    cache_size: 6000
    sample_window_size: 6000
    min_buffer_size: 2
    auto_save: False

  num_updates_per_step: 64
  target_update_freq: 1

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 2

  eval:
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    use_fixed_reset_state_ids: True
    group_size: 1
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: ""
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_type: "flow_policy"
    input_type: "state"
    policy_setup: "panda-ee-dpos"
    obs_dim: 42
    action_dim: 4
    num_action_chunks: 5     # H=5 chunked TD
    hidden_dim: 256

    precision: "32"
    add_value_head: False
    add_q_head: True
    num_q_heads: 4           # K=4 LCB ensemble (σ matches openpi config)

    denoising_steps: 4
    d_model: 96
    n_head: 4
    n_layers: 2
    use_batch_norm: False
    batch_norm_momentum: 0.99
    flow_actor_type: "JaxFlowTActor"
    noise_std_head: True
    log_std_min_train: -5
    log_std_max_train: 2
    log_std_min_rollout: -10
    log_std_max_rollout: 1
    noise_std_train: 0.3
    noise_std_rollout: 0.02

    is_lora: False
    lora_rank: 32
    ckpt_path: null
    gradient_checkpointing: False
    sharding_strategy: no_shard
    vh_mode: "q_network"
    q_network_separate_processing: True

    # σ N1 — CSF flags carried via openpi block name even on flow_policy
    # (model_type=flow_policy doesn't read these — they're a no-op marker for
    # the σ csf worker to detect "this is the small-MLP S3 sanity run").
    openpi:
      use_csf: True
      use_dsrl: False
      csf_num_q_heads: 4
      csf_kl_beta: 0.0           # no π0 ref for tiny flow MLP
      csf_bc_beta: 0.0           # no demo for PickCube
      csf_pessimism: 1.0
      csf_layerwise_gate: False

  optim:
    clip_grad: 1.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 1.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
