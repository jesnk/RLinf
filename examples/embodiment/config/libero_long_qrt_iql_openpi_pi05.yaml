# σ-QRT IQL variant on LIBERO-Long with pi0.5 frozen backbone.
#
# Inherits the σ-QRT base config (libero_long_qrt_openpi_pi05.yaml) and swaps
# the TD3+BC actor + critic for IQL's expectile-V + advantage-weighted BC.
#
# Why IQL: β sweep Phase 1 (commits up to 2d8e320) confirmed all TD3+BC σ-QRT
# variants (β ∈ {0.1, 0.3, 1.0}, sum-norm BC) get SR=0 vs B0=0.42 — q_mean
# trajectory negative, classic Q-extrapolation collapse. IQL avoids querying
# Q on OOD actions by routing the bootstrap through V_φ(s'); see design doc
# §4.1 fallback ladder.
#
# Consumed by examples/embodiment/run_qrt_offline.py with --use_iql or with
# training.use_iql=true (this yaml sets the latter).

defaults:
  - _self_

model:
  vla_ckpt: "ckpts/pi05_libero_sft"
  token_dim: 2048
  encoder_layers: 4
  encoder_heads: 8
  encoder_ffn: 4096
  decoder_layers: 4
  decoder_heads: 8
  decoder_ffn: 4096
  decoder_max_len: 1024
  actor_hidden: 256
  actor_layers: 2
  critic_hidden: 256
  critic_layers: 2
  # IQL value network sizing — defaults mirror the critic so V has the same
  # capacity as Q (minus the action input). Override here to decouple if
  # ablating V capacity.
  v_hidden: 256
  v_layers: 2
  action_dim: 7
  proprio_dim: 8
  chunk_len: 10

training:
  lr_actor: 1.0e-4
  lr_critic: 1.0e-4
  lr_encoder: 1.0e-4
  batch_size: 256
  gamma: 0.95
  # IQL has no BC weight term — advantage weighting replaces it. beta_bc is
  # retained for back-compat (other code paths read it) but unused on the IQL
  # train_step path.
  beta_bc: 0.3
  alpha_recon: 0.5
  tau_target: 0.005
  # IQL still uses TD3-style soft target-critic updates; actor_update_freq is
  # ignored on the IQL path (actor updates every step). target_noise_* are
  # ignored too — IQL never samples actions from π_target.
  actor_update_freq: 2
  action_std: 0.05
  target_noise_std: 0.2
  target_noise_clip: 0.5
  ref_action_dropout: 0.5
  stop_grad_z_rl_next: true
  grad_clip_norm: 1.0
  warmup_steps: 2000          # Stage 1 token warmup (RLT App. B: 2k-10k)
  max_train_steps: 50000      # Stage 2 joint training duration (W4 gate may shorten)
  replay_warmup_fill: 2000
  q_clamp: null

  # ----- IQL-specific hparams -----
  use_iql: true               # Worker dispatches to train_step_iql when true.
  iql_tau: 0.7                # Expectile in (0.5, 1). 0.7 matches LIBERO scale;
                              # try 0.8/0.9 for D4RL-style upper-tail bias.
  iql_beta: 3.0               # AWR temperature. Higher → sharper advantage
                              # weighting. Typical sweep {3, 10, 30}.
  iql_weight_clip: 100.0      # exp(β·adv) clamp for numerical stability.

  # ----- G2 residual-actor variant (off by default; opt in per-launcher) -----
  # When use_residual_actor=true:
  #   a_pred = ref_action + Δ_θ(z_rl, s_p, ref_action)   [Δ from actor.forward(residual=True)]
  #   L_actor = E[w(s,a)·‖Δ‖²] + α·-Q1(s, a_pred) + λ·‖Δ‖²
  # SR floor = B0 (π0.5 alone) is structurally guaranteed by Δ→0.
  # See worker module docstring for derivation.
  use_residual_actor: false   # G2 flag — flip on in launchers / overrides.
  residual_alpha: 0.1         # Q-max term weight (α). Larger → more aggressive correction.
  residual_reg: 0.0           # Optional L2 on Δ. 0 disables.

  # ----- G2 v3 CQL conservative penalty (off by default; opt in per-launcher) -----
  # When use_cql=true, the IQL Q-loss adds α_cql · (logsumexp_a Q(s,a) − Q(s,a_data)).
  # Pushes Q(s, OOD_a) DOWN relative to Q(s, a_data), giving the residual
  # actor a prefer-in-distribution gradient. See losses.qrt_cql_penalty.
  use_cql: false
  cql_alpha: 1.0              # Penalty weight. Sweep {0.5, 1.0, 5.0}.
  cql_num_random: 10          # Random actions sampled per state.
  cql_action_low: -1.0
  cql_action_high: 1.0
  cql_noise_std: 0.3          # Local perturbation stddev for CQL(H)-style sampling.

env:
  name: libero_long
  num_tasks: 10
  max_episode_len: 600
  num_eval_episodes: 50

data:
  offline_buffer_path: "data/sigma_qrt/libero_long/transitions_B5k.pkl"
  capacity: 30000

logging:
  wandb_project: "sigma_qrt"
  wandb_run_name: "qrt_iql_libero_long_pi05_B5k_seed${seed}"
  log_interval: 100
  eval_interval: 5000
  save_interval: -1

seed: 1
