# σ N1 main config — Chunked SAC-Flow on π0.5, LIBERO-Spatial.
# Derived from libero_spatial_dsrl_openpi_pi05.yaml.
#
# 핵심 차이:
#   actor.model.openpi.use_csf: True (σ N1)
#   actor.model.openpi.use_dsrl: False
#   actor.model.openpi.csf_*: σ N1 specific (KL/BC/gate config)
#   algorithm.adv_type: embodied_csf
#   algorithm.loss_type: embodied_csf
#   runner.max_epochs: 50 (Phase 2 budget)
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_csf_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 50  # Phase 2 budget
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level    # σ — chunk-level rewards for chunked TD
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 200
  adv_type: embodied_csf       # σ N1
  loss_type: embodied_csf      # σ N1
  loss_agg_func: "token-mean"

  agg_q: mean                  # actor uses mean of K Q-heads, critic uses LCB
  actor_agg_q: mean
  backup_entropy: True
  critic_subsample_size: 0
  critic_actor_ratio: 1

  # Chunked Q (σ N1 unbiased H-step backup)
  chunked_per_step_termination: True

  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 10
    auto_save: False

  # σ N1 — demo buffer for BC regularization
  demo_buffer:
    enable_cache: True
    cache_size: 5000
    sample_window_size: 5000
    min_buffer_size: 0
    auto_save: False
    load_path: null  # set to demo path for warm-start

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 16
    auto_reset: False
    use_rel_reward: False
    use_step_penalty: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
  eval:
    total_num_envs: 500
    auto_reset: True
    use_rel_reward: False
    use_step_penalty: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    is_eval: True
    group_size: 1
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/home/jskang/sigma/ckpt/pi05_libero_sft"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32   # smaller than DSRL — full π0.5 BPTT is heavier
  global_batch_size: 256
  seed: 42
  enable_offload: False

  model:
    model_path: "/home/jskang/sigma/ckpt/pi05_libero_sft"
    num_action_chunks: 5    # H = 5 — chunked TD horizon
    num_steps: 3            # denoise steps (start small for BPTT stability)
    add_value_head: False
    add_q_head: True
    q_head_type: "default"

    openpi:
      # ===== σ N1 Chunked SAC-Flow =====
      use_csf: True
      use_dsrl: False
      csf_num_q_heads: 4         # K=4 LCB ensemble
      csf_layerwise_gate: False  # σ N2 — disable in N1 main run
      csf_kl_beta: 0.1           # KL-to-π0-ref weight
      csf_bc_beta: 1.0           # BC reg weight
      csf_critic_state_dim: 512
      csf_sde_noise: 0.05        # small SDE noise for low BPTT div
      csf_pessimism: 1.0         # 1σ LCB

      # carry-over flags from DSRL config
      train_expert_only: True    # PaliGemma frozen, only action expert trains
      detach_critic_input: False # σ pathwise — DO NOT detach
      noise_method: "flow_sde"   # σ uses flow_sde for compatibility

  optim:
    lr: 5.0e-5                  # smaller than DSRL (BPTT through full expert)
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 1.0              # tighter clip — BPTT div protection

  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: True   # required for BPTT memory
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    training_backend: "fsdp"

reward:
  use_reward_model: False

critic:
  use_critic_model: False
