# ALOE (Advantage-weighted CFM, Q-chunking critic + K-ensemble LCB) baseline.
# Reference: arXiv:2602.12691 (AgiBot/HKUST/Fudan, 2026-02)
# Implements: rlinf.workers.actor.fsdp_aloe_policy_worker.EmbodiedALOEFSDPPolicy
# Uses    :  rlinf.algorithms.advantage_weighted_cfm + rlinf.algorithms.chunked_q
# Diff vs libero_spatial_qam_openpi_pi05.yaml:
#   * algorithm.loss_type:    embodied_aloe                (was embodied_qam)
#   * algorithm.adv_type:     advantage_weighted_cfm       (was embodied_qam)
#   * algorithm.aloe.*        ALOE-specific knobs
#   * algorithm.use_aloe:     True
#   * actor.model.add_q_head: True   (K-ensemble Q kept; we replace ONLY actor loss)
#   * actor.model.openpi.use_dsrl: False  (ALOE acts in weight space, like QAM)
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_aloe_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: 20000
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 40
  resume_dir: null
  ckpt_path: null

algorithm:
  use_aloe: True
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 200
  adv_type: advantage_weighted_cfm
  loss_type: embodied_aloe
  loss_agg_func: "token-mean"

  agg_q: min            # K-ensemble pessimistic LCB (paper Sec. 4)
  actor_agg_q: min
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1

  bootstrap_type: standard
  gamma: 0.99           # paper Appendix C2
  tau: 0.005            # Polyak; paper Appendix C2

  # Sigma-extension knob exposed for ablations (set True to weight chunked
  # advantage on top of the base ALOE w(A); default off to match the paper).
  advantage_beta: 0.5   # paper estimate; legacy alias for aloe.beta below

  # ALOE-specific knobs (consumed by EmbodiedALOEFSDPPolicy)
  aloe:
    beta: 0.5             # advantage temperature (paper estimate)
    eps_clip: 5.0         # symmetric clip on A/beta before exp
    w_max: null           # optional hard cap on weight (null = paper default)
    K_ensemble: 4         # K Q-heads for pessimistic LCB
    chunk_H: 5            # action-chunk horizon (== num_action_chunks)
    n_steps: 1            # n-step chunked TD (1 = standard chunked TD)
    num_flow_samples: 1   # # of (eta, eps) samples per actor minibatch

  replay_buffer:
    enable_cache: True
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 10
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    total_num_envs: 16
    auto_reset: False
    use_rel_reward: False
    use_step_penalty: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
  eval:
    total_num_envs: 500
    auto_reset: True
    use_rel_reward: False
    use_step_penalty: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    is_eval: True
    group_size: 1
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: True
      video_base_dir: \${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  model:
    model_path: "/home/jskang/sigma/ckpt/pi05_libero_sft"
    precision: \${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 256       # paper Appendix C2
  seed: 42
  enable_offload: False
  model:
    model_path: "/home/jskang/sigma/ckpt/pi05_libero_sft"
    num_action_chunks: 5
    num_steps: 3
    add_value_head: False
    add_q_head: True            # ALOE keeps K-ensemble Q for pessimistic LCB
    q_head_type: "default"
    num_q_heads: 4              # K = 4 (matches aloe.K_ensemble)
    openpi:
      use_dsrl: False           # ALOE operates in weight space (NOT noise space)
      train_expert_only: True
      detach_critic_input: True
      noise_method: "reinflow"
  optim:
    lr: 3.0e-5                  # paper Appendix C2 (peak)
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: \${actor.model.precision}
      reduce_dtype: \${actor.model.precision}
      buffer_dtype: \${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
