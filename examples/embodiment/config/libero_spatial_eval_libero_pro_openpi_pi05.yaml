# libero_spatial_eval_libero_pro_openpi_pi05.yaml
#
# LIBERO-PRO position-perturbation (swap) evaluation on libero_spatial.
#
# Position perturbation:
#   - bddl_files / init_files redirected to /home/jskang/sigma/liberopro_data
#     via the `liberopro` overlay package (LIBEROPRO_DATA_ROOT env var).
#   - For each task we generated 5 swap variants (`<task>_swap{0..4}.bddl`).
#   - The Spatial relation (object<->region) of `obj_of_interest` items in
#     the BDDL `(:init ...)` block is swapped, with object pairings drawn from
#     LIBERO-PRO's `libero_ood/ood_spatial_relation.yaml`.
#
# How to run (set LIBERO_TYPE=pro, LIBERO_PERTURBATION=swap):
#   bash examples/embodiment/eval_libero_pro.sh \
#        libero_spatial_eval_libero_pro_openpi_pi05 \
#        /path/to/your/ckpt
#
# Override ckpt to evaluate (πRL / DSRL / σ):
#   actor.model.model_path=/path/to/ckpt rollout.model.model_path=/path/to/ckpt

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_eval_libero_pro_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 4
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 8
    group_size: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240

  eval:
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/home/jskang/sigma/ckpt/pi05_libero_sft"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 1024
  seed: 42
  enable_offload: False

  model:
    model_path: "/home/jskang/sigma/ckpt/pi05_libero_sft"
    num_action_chunks: 5
    num_steps: 3

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
